name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/*.test.mjs
      - run: python3 scripts/build-review-demo.py --check
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.3"
          bundler-cache: true
      - name: Ruby release tests
        run: bundle exec ruby tests/fastlane_test.rb
      - name: Parse Fastlane lanes
        run: bundle exec fastlane lanes
