name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact iOS marketing version (major.minor.patch)
        required: true
        default: "1.0.0"
      ios_lane:
        description: Upload a candidate, release it, or resume submission of an existing build
        type: choice
        options: [internal, production, submit_review]
        default: internal
      build_number:
        description: Exact existing build number (required for submit_review)
        required: false
  push:
    tags:
      - "*"

permissions:
  contents: read

env:
  APP_VERSION: ${{ inputs.version || github.ref_name }}
  CI: true

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate store-compatible version
        run: node scripts/validate-release-version.mjs "$APP_VERSION"
      - name: Prevent blind upload retries
        env:
          IOS_LANE: ${{ inputs.ios_lane }}
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ] && [ "$IOS_LANE" != submit_review ]; then
            echo "Refusing to re-upload on a retry. Inspect the original run/store, then resume the exact iOS build with submit_review."
            exit 1
          fi

  android-closed:
    name: Android Closed Testing
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push'
    concurrency:
      group: release-android
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up mise
        uses: jdx/mise-action@v2

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.3"
          bundler-cache: true

      - name: Install SOPS
        run: |
          SOPS_VERSION=3.12.2
          curl -fsSL -o sops "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          chmod +x sops
          sudo mv sops /usr/local/bin/sops

      - name: Deploy Android closed testing release
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: bundle exec fastlane android closed

      - name: Upload Android APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          apk_path="android/app/build/outputs/apk/release/app-release.apk"
          asset_tag="${GITHUB_REF_NAME//\//-}"

          test -f "$apk_path"
          tag_note="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; leaving notes unchanged."
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "$tag_note" \
              --generate-notes \
              --fail-on-no-commits
          fi

          gh release upload "$GITHUB_REF_NAME" "$apk_path#Papyrd-${asset_tag}.apk" --clobber

  ios-internal:
    name: iOS Release
    runs-on: macos-26
    needs: validate
    concurrency:
      group: release-ios
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up mise
        uses: jdx/mise-action@v2

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.3"
          bundler-cache: true

      - name: Install SOPS
        run: |
          SOPS_VERSION=3.12.2
          curl -fsSL -o sops "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.darwin.amd64"
          chmod +x sops
          sudo mv sops /usr/local/bin/sops

      - name: Verify Xcode SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Deploy iOS release
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          IOS_LANE: ${{ inputs.ios_lane || (vars.IOS_PRODUCTION_READY == 'true' && 'production' || 'internal') }}
          EXISTING_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          case "$IOS_LANE" in
            submit_review)
              bundle exec fastlane ios submit_review "version:$APP_VERSION" "build_number:$EXISTING_BUILD_NUMBER"
              ;;
            production|internal)
              bundle exec fastlane ios "$IOS_LANE"
              ;;
            *) exit 1 ;;
          esac
      - name: Explain release state
        if: success()
        run: |
          echo 'Store upload/submission finished. App Review approval and live availability must be verified separately in App Store Connect.' >> "$GITHUB_STEP_SUMMARY"
